services:
  postgres:
    image: postgres:16
    container_name: sifen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sifen_db
      POSTGRES_USER: sifen
      POSTGRES_PASSWORD: sifen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifen -d sifen_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
