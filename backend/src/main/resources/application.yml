spring:
  application:
    name: sifen
  datasource:
    url: jdbc:postgresql://localhost:5432/sifen_db
    username: sifen
    password: sifen
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

sifen:
  security:
    jwt:
      # Solo para desarrollo local. En homologación/producción se debe sobreescribir con la variable
      # de entorno SIFEN_SECURITY_JWT_SECRET (clave de al menos 256 bits en base64).
      secret: ${SIFEN_SECURITY_JWT_SECRET:ZGVzYXJyb2xsby1sb2NhbC1zaWZlbi1qd3Qtc2VjcmV0LWNhbWJpYXItZW4tcHJvZHVjY2lvbg==}
      expiration-minutes: 480
  cors:
    allowed-origins: ${SIFEN_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    # Carpeta donde el stub de envío de correo (EnviadorEmailStub) escribe el PDF/XML/resumen
    # simulados. TODO: reemplazar por credenciales SMTP reales cuando estén disponibles.
    outbox-dir: ${SIFEN_EMAIL_OUTBOX_DIR:./emails-simulados}
  firma:
    # Certificado digital (.pfx/PKCS12) del contribuyente. Sin valor por defecto a propósito: son
    # secretos, y solo hacen falta cuando sifen.envio.modo=real (SifenKeystoreConfig).
    keystore-path: ${SIFEN_FIRMA_KEYSTORE_PATH:}
    keystore-password: ${SIFEN_FIRMA_KEYSTORE_PASSWORD:}
    key-alias: ${SIFEN_FIRMA_KEY_ALIAS:}
  # Los datos del emisor (RUC, dirección, actividad económica, timbrado) se cargan desde la pantalla
  # "Configuración del emisor"; el establecimiento/punto de expedición, en cada factura.
  qr:
    # Código de seguridad del contribuyente (CSC) para el QR del DE (Manual Técnico v150, 13.8). Lo
    # entrega la SET al habilitar al facturador electrónico. Default: el valor de ejemplo del manual,
    # solo útil en el ambiente de test.
    id-csc: ${SIFEN_QR_ID_CSC:0001}
    csc: ${SIFEN_QR_CSC:ABCD0000000000000000000000000000}
  envio:
    # "stub" (default): EnviadorSifenStub, sin red real. "real": EnviadorSifenSoapService, con TLS
    # mutuo contra el SIFEN real (requiere sifen.firma.keystore-* configurado).
    modo: ${SIFEN_ENVIO_MODO:stub}
    timeout-segundos: ${SIFEN_ENVIO_TIMEOUT_SEGUNDOS:30}
    # WS de consulta de RUC (siConsRUC, Manual Técnico v150, sección 9.6). Default: ambiente de test.
    # Producción: https://sifen.set.gov.py/de/ws/consultas/consulta-ruc.wsdl
    url-consulta-ruc: ${SIFEN_ENVIO_URL_CONSULTA_RUC:https://sifen-test.set.gov.py/de/ws/consultas/consulta-ruc.wsdl}
    # Historial append-only de cada intento real contra el SIFEN (aprobado, rechazado o con error de
    # conexión) — para poder mostrar cómo fue avanzando la integración a lo largo del tiempo.
    historial-path: ${SIFEN_ENVIO_HISTORIAL_PATH:./sifen-envios-historial.jsonl}

logging:
  level:
    com.tottalstore.sifen: INFO
